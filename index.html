<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>湘西吊脚楼｜3D交互模型</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3eee3;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}
#view{width:100%;height:100%;display:block}
#ui{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;color:#4b3421;pointer-events:none}
#ui h1{margin:0;font-size:28px;font-weight:600}
#ui p{margin:7px 0 12px;font-size:14px}
#toggle{position:fixed;right:28px;bottom:28px;z-index:8;pointer-events:auto;border:0;border-radius:12px;padding:13px 30px;background:#765236;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 5px 14px #0002}
#labels{position:fixed;left:28px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:18px;pointer-events:none}
.labelCard{min-width:225px;padding:12px 16px;border-radius:12px;background:rgba(255,250,235,.92);box-shadow:0 3px 12px rgba(0,0,0,.08);color:#5a3c24;font-size:15px;text-align:left}
#tip{position:fixed;bottom:18px;left:28px;background:#fffC;padding:8px 12px;border-radius:8px;color:#604832;font-size:13px}
#load{position:fixed;inset:0;background:#f3eee3;display:flex;align-items:center;justify-content:center;font-size:26px;color:#5a3c24;z-index:10}
</style>
</head>
<body>
<div id="load">正在准备吊脚楼模型……</div>
<canvas id="view"></canvas>
<div id="ui"><h1>湘西吊脚楼</h1><p>拖动鼠标旋转 · 滚轮缩放</p></div>
<div id="labels"><div class="labelCard">屋顶</div><div class="labelCard">中间两层：楼板、屋身、门窗</div><div class="labelCard">最下一层：石基与吊脚木柱</div></div>
<button id="toggle">展开</button>
<div id="tip">拖动模型可旋转 · 滚轮可缩放</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('view');
if(!window.THREE){document.getElementById('load').textContent='Three.js 加载失败，请检查网络连接';return;}

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=false;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf3eee3);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(8,5.8,10);
camera.lookAt(0,1.2,0);

scene.add(new THREE.HemisphereLight(0xfff8e8,0x675b50,2.2));
const sun=new THREE.DirectionalLight(0xfff5dc,3.2);
sun.position.set(6,10,7); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);


const root=new THREE.Group(); scene.add(root);
const bottom=new THREE.Group(), middle=new THREE.Group(), top=new THREE.Group();
root.add(bottom,middle,top);


const wood=new THREE.MeshStandardMaterial({color:0x7b4b29,roughness:.82});
const woodLight=new THREE.MeshStandardMaterial({color:0xa86e3e,roughness:.8});
const wall=new THREE.MeshStandardMaterial({color:0xb9824c,roughness:.88});
const darkWood=new THREE.MeshStandardMaterial({color:0x4e2d1b,roughness:.9});
const stone=new THREE.MeshStandardMaterial({color:0x77746d,roughness:1});
const roofMat=new THREE.MeshStandardMaterial({color:0x58311d,roughness:.92});
const roofEdge=new THREE.MeshStandardMaterial({color:0x3d2416,roughness:.92});

function box(group,x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; group.add(m); return m;
}
function wallWithOpenings(group, yCenter, z, wallWidth, wallHeight, openings){
 const left=-wallWidth/2, right=wallWidth/2;
 const sorted=[...openings].sort((a,b)=>a.x-b.x);
 let cursor=left;
 for(const o of sorted){
   const ol=o.x-o.w/2;
   if(ol>cursor) box(group,(cursor+ol)/2,yCenter,z,ol-cursor,wallHeight,.18,wall);
   const bottomY=yCenter-wallHeight/2;
   const topY=yCenter+wallHeight/2;
   const ob=o.y-o.h/2, ot=o.y+o.h/2;
   if(ob>bottomY) box(group,o.x,(bottomY+ob)/2,z,o.w,ob-bottomY,.18,wall);
   if(topY>ot) box(group,o.x,(ot+topY)/2,z,o.w,topY-ot,.18,wall);
   cursor=o.x+o.w/2;
 }
 if(cursor<right) box(group,(cursor+right)/2,yCenter,z,right-cursor,wallHeight,.18,wall);
}

function cylinder(group,x,y,z,r,h,mat,radial=8){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),mat);
 m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; group.add(m); return m;
}
function roofPrism(group, y, width, depth, height, mat){
 // triangular prism with ridge along Z
 const w=width/2, d=depth/2;
 const verts=new Float32Array([
   -w,0,-d,  w,0,-d,  0,height,-d,
   -w,0, d,  w,0, d,  0,height, d
 ]);
 const inds=[0,1,2,3,5,4,0,3,4,0,4,1,1,4,5,1,5,2,2,5,3,2,3,0];
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(verts,3));
 g.setIndex(inds); g.computeVertexNormals();
 const m=new THREE.Mesh(g,mat); m.position.y=y; m.castShadow=true; m.receiveShadow=true; group.add(m); return m;
}

// ---------- 底部：石基 + 吊脚木柱 ----------
box(bottom,0,-2.72,0,5.5,.55,4.0,stone);
box(bottom,0,-2.35,0,5.0,.18,3.55,darkWood);

// 8根明显的吊脚木柱
for(const x of [-2.05,-.7,.7,2.05]){
  for(const z of [-1.3,1.3]) box(bottom,x,-1.35,z,.24,2.25,.24,wood);
}
// 斜撑，让“吊脚”特征更明显
for(const x of [-2.05,-.7,.7,2.05]){
  const b=box(bottom,x,-.15,-1.3,.18,1.15,.18,woodLight);
  b.rotation.z=(x>0?-1:1)*.38;
}
box(bottom,0,-.15,0,5.0,.22,3.5,woodLight);

// ---------- 中部：主体 ----------
box(middle,0,.02,0,5.15,.22,3.55,darkWood);
// 第一层墙体：门窗位置真正开洞，门窗与墙面严格对齐
wallWithOpenings(middle,.95,1.625,4.85,1.75,[
 {x:-.85,y:1.02,w:.85,h:1.25},
 {x:.75,y:1.12,w:.95,h:.82},
]);
wallWithOpenings(middle,.95,-1.625,4.85,1.75,[
 {x:-.85,y:1.02,w:.85,h:1.25},
 {x:.75,y:1.12,w:.95,h:.82},
]);
// 侧墙
box(middle,-2.335,.95,0,.18,1.75,3.25,wall);
box(middle, 2.335,.95,0,.18,1.75,3.25,wall);

// 木框架
for(const x of [-2.25,-1.1,0,1.1,2.25]){
  box(middle,x,.95,-1.68,.18,1.95,.18,wood);
  box(middle,x,.95,1.68,.18,1.95,.18,wood);
}
box(middle,0,1.82,-1.68,5.0,.18,.18,wood);
box(middle,0,.05,-1.68,5.0,.18,.18,wood);

// 第一层前后门窗：完全落在墙体开洞内
function addDoorWindowSet(yDoor,yWin,z,back=false){
 const zz=z+(back?-0.08:0.08);
 // door
 box(middle,-.85,yDoor,zz,.82,1.18,.10,darkWood);
 box(middle,-1.30,yDoor,zz+(back?-0.07:0.07),.10,1.30,.12,wood);
 box(middle,-.40,yDoor,zz+(back?-0.07:0.07),.10,1.30,.12,wood);
 box(middle,-.85,yDoor+0.62,zz+(back?-0.07:0.07),.98,.10,.12,wood);
 // window
 box(middle,.75,yWin,zz,.92,.76,.10,woodLight);
 box(middle,.75,yWin,zz+(back?-0.07:0.07),.76,.58,.06,woodLight);
 box(middle,.75,yWin,zz+(back?-0.10:0.10),.07,.66,.04,darkWood);
 box(middle,.75,yWin,zz+(back?-0.10:0.10),.82,.06,.04,darkWood);
}
addDoorWindowSet(1.02,1.12,1.625,false);
addDoorWindowSet(1.02,1.12,-1.625,true);

// 二层地板// 二层地板
box(middle,0,1.95,0,5.15,.22,3.55,woodLight);

// ---------- 中间两层：第二层主体（与下层同属一个整体） ----------
// 第二层楼板
box(middle,0,1.95,0,5.15,.22,3.55,woodLight);
// 第二层墙体
// 第二层墙体：门窗位置同样真正开洞
wallWithOpenings(middle,2.78,1.625,4.85,1.35,[
 {x:-.85,y:2.78,w:.85,h:1.05},
 {x:.75,y:2.90,w:1.00,h:.72},
]);
wallWithOpenings(middle,2.78,-1.625,4.85,1.35,[
 {x:-.85,y:2.78,w:.85,h:1.05},
 {x:.75,y:2.90,w:1.00,h:.72},
]);
// 侧墙
box(middle,-2.335,2.78,0,.18,1.35,3.25,wall);
box(middle, 2.335,2.78,0,.18,1.35,3.25,wall);

// 第二层木框架
for(const x of [-2.25,-1.1,0,1.1,2.25]){
  box(middle,x,2.78,-1.68,.18,1.55,.18,wood);
  box(middle,x,2.78,1.68,.18,1.55,.18,wood);
}
box(middle,0,3.48,-1.68,5.0,.18,.18,wood);
box(middle,0,2.10,-1.68,5.0,.18,.18,wood);

// 第二层门窗：与开洞完全对齐，不再穿墙
function addSecondDoorWindowSet(z,back=false){
 const zz=z+(back?-0.08:0.08);
 box(middle,-.85,2.78,zz,.82,1.05,.10,darkWood);
 box(middle,-1.30,2.78,zz+(back?-0.07:0.07),.10,1.15,.12,wood);
 box(middle,-.40,2.78,zz+(back?-0.07:0.07),.10,1.15,.12,wood);
 box(middle,-.85,3.30,zz+(back?-0.07:0.07),.98,.10,.12,wood);
 box(middle,.75,2.90,zz,1.00,.70,.10,woodLight);
 box(middle,.75,2.90,zz+(back?-0.07:0.07),.84,.54,.06,woodLight);
 box(middle,.75,2.90,zz+(back?-0.10:0.10),.07,.62,.04,darkWood);
 box(middle,.75,2.90,zz+(back?-0.10:0.10),.90,.06,.04,darkWood);
}
addSecondDoorWindowSet(1.625,false);
addSecondDoorWindowSet(-1.625,true);

// ---------- 顶部：完整坡屋顶（第三部分） ----------
// roof base and pitched roof
box(top,0,3.62,0,5.8,.22,4.15,roofEdge);
roofPrism(top,3.70,6.1,4.55,1.65,roofMat);
// ridge beam
box(top,0,5.43,0,.30,.25,4.55,roofEdge);

// roof end caps / eaves
box(top,-3.02,3.82,0,.18,.28,4.45,roofMat);
box(top,3.02,3.82,0,.18,.28,4.45,roofMat);

// ---------- 左侧说明改为固定网页 UI，不随模型旋转 ----------
// ---------- 交互 ----------
let targetRot=0.55, targetPitch=.10, radius=12;
let down=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
 if(!down)return;
 targetRot+=(e.clientX-lastX)*.008;
 targetPitch+=(e.clientY-lastY)*.006;
 targetPitch=Math.max(-.45,Math.min(.6,targetPitch));
 lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('pointerup',()=>down=false);
canvas.addEventListener('wheel',e=>{
 e.preventDefault();
 radius+=e.deltaY*.008; radius=Math.max(8,Math.min(18,radius));
 const k=radius/12;
 camera.position.x=8.0*k; camera.position.z=10.0*k;
},{passive:false});

let exploded=false, anim=0;
document.getElementById('toggle').onclick=()=>{
 exploded=!exploded;
 document.getElementById('toggle').textContent=exploded?'复原':'展开';
};

function animate(){
 requestAnimationFrame(animate);
 const goal=exploded?1:0;
 anim+=(goal-anim)*.09;
 bottom.position.y=-1.65*anim;
 top.position.y=2.20*anim;
 middle.position.y=0;

 root.rotation.y += (targetRot-root.rotation.y)*.08;
 // 相机固定在模型外侧，只旋转吊脚楼主体本身；这样旋转时能明确看到四周结构
 const k=radius/12;
 camera.position.x=8.0*k;
 camera.position.z=10.0*k;
 camera.position.y=3.0+targetPitch*3.5;
 camera.lookAt(0,.9,0);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
});
setTimeout(()=>document.getElementById('load').remove(),700);
})();
</script>
</body>
</html>
